<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <!-- Clock circle -->
  <circle cx="512" cy="420" r="160" fill="#fff" opacity="0.95"/>
  <!-- Clock hands -->
  <line x1="512" y1="420" x2="512" y2="320" stroke="#0071e3" stroke-width="16" stroke-linecap="round"/>
  <line x1="512" y1="420" x2="580" y2="440" stroke="#0071e3" stroke-width="12" stroke-linecap="round"/>
  <circle cx="512" cy="420" r="16" fill="#0071e3"/>
  <!-- Euro symbol -->
  <text x="512" y="780" font-family="system-ui" font-size="240" font-weight="700" fill="#fff" text-anchor="middle">€</text>
</svg>
